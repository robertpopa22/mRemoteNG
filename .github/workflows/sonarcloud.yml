name: SonarCloud Analysis

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup dotnet
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
        with:
          vs-version: "[18.0,19.0)"

      - name: Install SonarScanner
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-sonarscanner

      - name: Install Java (required by SonarScanner)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Begin SonarCloud analysis
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet-sonarscanner begin `
            /k:"robertpopa22_mRemoteNG" `
            /o:"robertpopa22" `
            /d:sonar.token="$env:SONAR_TOKEN" `
            /d:sonar.host.url="https://sonarcloud.io" `
            /d:sonar.cs.vscoveragexml.reportsPaths="**/coverage.opencover.xml" `
            /d:sonar.coverageReportPaths="$env:RUNNER_TEMP/powershell-tests/powershell-sonar-coverage.xml" `
            /d:sonar.qualitygate.wait=true `
            /d:sonar.exclusions="**/obj/**,**/bin/**,**/*.Designer.cs,**/Interop*.cs,ObjectListView/**,.project-roadmap/**,scripts/**,.githooks/**" `
            /d:sonar.coverage.exclusions="**/UI/**/*.cs,**/Connection/Protocol/**/*.cs,**/Themes/**/*.cs,**/TaskDialog/**/*.cs,**/App/ProgramRoot.cs,**/App/Runtime.cs,**/App/RestApiService.cs,**/App/CompatibilityChecker.cs,**/App/Diagnostics/**/*.cs,**/App/RuntimeDiagnostics.cs,**/App/DevLog.cs,**/App/Initialization/**/*.cs,**/Config/Settings/DockPanelLayoutLoader.cs,**/Config/Settings/LocalSettingsManager.cs,**/Config/Settings/ExternalAppsSaver.cs,**/Config/Settings/ExternalAppsLoader.cs,**/Config/Putty/**/*.cs,**/Config/Connections/SqlConnectionsSaver.cs,**/Config/Connections/Multiuser/**/*.cs,**/Config/Settings/QuickConnectHistoryLoader.cs,**/Connection/ConnectionInitiator.cs,**/Messages/MessageWriters/PopupMessageWriter.cs,**/Tools/PortScanner.cs,**/Tools/IeBrowserEmulation.cs,**/Tools/ProcessController.cs,ExternalConnectors/**/*.cs"

      - name: Build with MSBuild
        shell: pwsh
        run: |
          msbuild "$env:GITHUB_WORKSPACE\mRemoteNG.sln" /restore /m /verbosity:minimal -p:Configuration=Release -p:Platform=x64

      - name: Install coverage tool
        shell: pwsh
        run: dotnet tool install --global dotnet-coverage

      - name: Run tests with coverage
        shell: pwsh
        run: |
          # Instrument the same grouped suite as nightly, including its isolated UI tests.
          dotnet-coverage collect `
            --output coverage.opencover.xml `
            --output-format xml `
            "${env:ProgramFiles}/Git/bin/bash.exe" run-tests-core.sh

      - name: Run PowerShell tests with coverage
        shell: pwsh
        run: |
          Install-Module -Name Pester -RequiredVersion 6.2.0 -Repository PSGallery -Scope CurrentUser -Force
          ./scripts/Invoke-PowerShellTests.ps1 -OutputDirectory "$env:RUNNER_TEMP/powershell-tests"

      - name: End SonarCloud analysis
        shell: pwsh
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
