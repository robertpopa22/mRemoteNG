name: Nightly Build

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly:
    name: Build & Test (x64)
    runs-on: windows-2025-vs2026
    # Publishing lives in the job below with its own contents: write token. This job
    # holds only read permissions, so the token the SignPath action receives (it uses
    # github.token to fetch the artifact) cannot write to the repository.
    outputs:
      zipname: ${{ steps.meta.outputs.zipname }}
      msiname: ${{ steps.meta.outputs.msiname }}
      version: ${{ steps.meta.outputs.version }}
      date: ${{ steps.meta.outputs.date }}
      sha: ${{ steps.meta.outputs.sha }}
    env:
      # 'true' once both SignPath secrets exist; the signing steps key off this.
      SIGNPATH_CONFIGURED: ${{ secrets.SIGNPATH_API_TOKEN != '' && secrets.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: 10.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
        with:
          vs-version: "[18.0,19.0)"

      - name: Cache NuGet
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-x64-nuget-${{ hashFiles('**/*.csproj', '**/*.wixproj') }}
          restore-keys: |
            ${{ runner.os }}-x64-nuget-

      - name: Generate AssemblyInfo.cs from csproj version
        shell: pwsh
        run: |
          $csprojPath = "$env:GITHUB_WORKSPACE/mRemoteNG/mRemoteNG.csproj"
          $csprojContent = Get-Content $csprojPath -Raw
          if ($csprojContent -match '<Version>([^<]+)</Version>') {
            $csprojVersion = $matches[1].Trim()
          } else {
            throw "Could not find <Version> element in csproj"
          }
          Write-Host "Version from csproj: $csprojVersion"
          if ($csprojVersion -match '^(\d+)\.(\d+)\.(\d+)') {
            $major = [int]$matches[1]; $minor = [int]$matches[2]; $revision = [int]$matches[3]
          } else {
            throw "Could not parse version from csproj: $csprojVersion"
          }
          $prerelease = if ($csprojVersion -match '-(.+)$') { "-$($matches[1])" } else { "" }
          $channel = if ($prerelease) { "Pre-release" } else { "Release" }
          $base = [datetime]"2019-09-02"
          $build = [int](([datetime]::UtcNow - $base).TotalMinutes / 1000)
          $platform = "x64"
          $year = [datetime]::UtcNow.Year
          $content = @"
          //Generated for platform: $platform
          using System.Reflection;
          using System.Resources;
          //Build nr: $build
          [assembly: AssemblyTitle("mRemoteNG")]
          [assembly: AssemblyDescription("Multi-Remote Next Generation Connection Manager")]
          [assembly: AssemblyConfiguration("$platform")]
          [assembly: AssemblyCompany("Profi-KOM Ltd.")]
          [assembly: AssemblyProduct("mRemoteNG Connection Manager")]
          [assembly: AssemblyCopyright("(c) $year mRemoteNG")]
          [assembly: AssemblyTrademark("Profi-KOM LTd.")]
          [assembly: AssemblyCulture("")]
          [assembly: AssemblyVersion("$major.$minor.$revision.$build")]
          [assembly: AssemblyFileVersion("$major.$minor.$revision.$build")]
          [assembly: NeutralResourcesLanguageAttribute("en-US")]
          [assembly: AssemblyInformationalVersion("$major.$minor.$revision$prerelease ($channel $build) $platform")]
          "@
          $outPath = "$env:GITHUB_WORKSPACE\mRemoteNG\Properties\AssemblyInfo.cs"
          Set-Content -Path $outPath -Value $content -Encoding UTF8
          Write-Host "Generated AssemblyInfo.cs: v$major.$minor.$revision$prerelease.$build ($channel) $platform"

      - name: Build x64 Release
        run: msbuild mRemoteNG.sln /restore -m /verbosity:minimal -p:Configuration=Release -p:Platform=x64

      - name: Smoke test (app starts)
        shell: pwsh
        run: |
          # WinExe app needs Start-Process (no attached console for & operator)
          $proc = Start-Process -FilePath ".\mRemoteNG\bin\x64\Release\mRemoteNG.exe" -ArgumentList "--version" -Wait -PassThru -WindowStyle Hidden
          if ($proc.ExitCode -ne 0) { throw "Smoke test failed: exit code $($proc.ExitCode)" }
          Write-Host "Smoke test passed (exit code: $($proc.ExitCode))"

      - name: Run tests
        shell: bash
        run: bash run-tests-core.sh

      - name: Collect test results on failure
        if: failure()
        shell: pwsh
        run: |
          $outDir = "$env:GITHUB_WORKSPACE\test-results-dump"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          # run-tests-core.sh now preserves failed trx into $REPO_ROOT/test-results-dump
          # directly. Also walk common temp roots as fallback in case of crashes
          # before preservation.
          $roots = @($outDir, $env:TEMP, $env:TMP, "$env:GITHUB_WORKSPACE",
                     "C:\Users\runneradmin\AppData\Local\Temp",
                     "C:\Windows\Temp") | Where-Object { $_ -and (Test-Path $_) } | Select-Object -Unique
          $trx = foreach ($r in $roots) { Get-ChildItem $r -Recurse -Filter *.trx -ErrorAction SilentlyContinue }
          $trx = $trx | Sort-Object FullName -Unique
          foreach ($t in $trx) {
            $dest = Join-Path $outDir ("{0}_{1}" -f $t.Directory.Name, $t.Name)
            if ($t.FullName -ne $dest) { Copy-Item $t.FullName $dest -Force }
          }
          Write-Host "Collected $(($trx | Measure-Object).Count) trx files:"
          Get-ChildItem $outDir -Filter *.trx | Select-Object Name, Length | Format-Table -AutoSize
          # Surface failed test names directly to the step log for quick triage
          foreach ($f in Get-ChildItem $outDir -Filter *.trx) {
            Write-Host ""; Write-Host "=== $($f.Name) — failures ==="
            [xml]$x = Get-Content $f.FullName -Raw
            $ns = New-Object System.Xml.XmlNamespaceManager($x.NameTable)
            $ns.AddNamespace('t','http://microsoft.com/schemas/VisualStudio/TeamTest/2010')
            $fails = $x.SelectNodes('//t:UnitTestResult[@outcome="Failed"]', $ns)
            foreach ($u in $fails) {
              Write-Host ("  X " + $u.testName)
              $msg = $u.SelectSingleNode('t:Output/t:ErrorInfo/t:Message', $ns)
              if ($msg) { Write-Host ("    " + $msg.InnerText.Split("`n")[0]) }
            }
            # Also surface RunInfo aborts (crashes without UnitTestResult entries)
            $aborts = $x.SelectNodes('//t:RunInfos/t:RunInfo[@outcome="Error"]', $ns)
            foreach ($a in $aborts) {
              $t = $a.SelectSingleNode('t:Text', $ns)
              if ($t) { Write-Host ("  !! CRASH: " + $t.InnerText.Split("`n")[0]) }
            }
          }

      - name: Upload test results artifact
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: test-results-${{ github.sha }}
          path: test-results-dump/
          retention-days: 14
          if-no-files-found: warn

      - name: Build MSI installer
        shell: pwsh
        run: |
          $csproj = Get-Content "mRemoteNG/mRemoteNG.csproj" -Raw
          if ($csproj -match '<Version>(\d+\.\d+\.\d+)') { $msiVersion = $matches[1] }
          Write-Host "Building MSI (version: $msiVersion)..."
          pwsh -NoProfile -ExecutionPolicy Bypass -File build-msi.ps1 -NoBuild -HarvestPath "$env:GITHUB_WORKSPACE\mRemoteNG\bin\x64\Release"

      - name: Compute version & create artifacts
        id: meta
        shell: pwsh
        run: |
          # Read version from csproj
          $csproj = Get-Content "mRemoteNG/mRemoteNG.csproj" -Raw
          if ($csproj -match '<Version>([^<]+)</Version>') {
            $version = $matches[1].Trim()
          } else {
            throw "Could not find <Version> in csproj"
          }

          $date = Get-Date -Format "yyyyMMdd"
          $sha = "${{ github.sha }}".Substring(0, 7)
          $zipName = "mRemoteNG-nightly-$date-v$version-$sha-x64.zip"

          # Create ZIP (framework-dependent, x64)
          $sourceDir = "mRemoteNG\bin\x64\Release"

          # Defense-in-depth: strip anything that could contain user connection data
          # before packaging. CI runners should never stage these, but the extra sweep
          # costs a few ms and the blast radius of a miss is too high to skip.
          $settingsPath = Join-Path $sourceDir 'Settings'
          if (Test-Path $settingsPath) {
            Write-Host "Removing stray Settings/ before packaging"
            Remove-Item -Recurse -Force $settingsPath
          }
          Get-ChildItem -Path $sourceDir -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like 'confCons*' -or $_.Name -like '*.xml.backup*' -or $_.Name -like '*.settings' } |
            ForEach-Object {
              Write-Host "Removing forbidden file: $($_.FullName)"
              Remove-Item -Force $_.FullName
            }

          $items = Get-ChildItem -Path $sourceDir | Where-Object {
            $_.Name -notin @('ref','publish','win-x64','win-x86','win-arm64','win-x64-sc','Settings')
          }
          Compress-Archive -Path $items.FullName -DestinationPath $zipName -Force
          Write-Host "Created: $zipName ($('{0:N1} MB' -f ((Get-Item $zipName).Length / 1MB)))"

          # Post-zip sanity check — fail the workflow if anything sensitive slipped
          # through. Uses .NET ZipFile so it does not depend on runner tar.exe.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $zipName))
          try {
            # Schemas/mremoteng_confcons_v2_8.xsd is a legitimate shipped asset,
            # so exclude *.xsd matches from the leak pattern.
            $leaks = $archive.Entries | ForEach-Object { $_.FullName } | Where-Object {
              ($_ -like 'Settings/*') -or
              ($_ -like '*.xml.backup*') -or
              ($_ -like '*.settings') -or
              ($_ -like '*confCons*' -and $_ -notlike '*.xsd')
            }
          }
          finally { $archive.Dispose() }
          if ($leaks) {
            Write-Error "Release ZIP contains forbidden paths:`n  $($leaks -join "`n  ")"
            exit 1
          }
          Write-Host "Sanity check passed: no Settings/confCons/backup entries in ZIP"

          # Every assembly the build declares it needs must be in the package. mRemoteNG keeps most
          # of its dependencies in an Assemblies\ subfolder and finds them with a custom
          # AssemblyResolve handler, so a dependency the copy step never learned about resolves
          # perfectly in development and throws FileNotFoundException on a user's machine (#150).
          # The app-level test sees only the build output; this sees the artifact that ships.
          pwsh -NoProfile -ExecutionPolicy Bypass `
            -File "$Env:GITHUB_WORKSPACE\scripts\verify-shipped-assemblies.ps1" `
            -Path $zipName
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # Find MSI
          $msi = Get-ChildItem -Path "mRemoteNGInstaller\bin" -Recurse -Filter "*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          $msiName = ""
          if ($msi) {
            $msiName = "mRemoteNG-nightly-$date-v$version-$sha-x64.msi"
            Copy-Item $msi.FullName -Destination $msiName
            Write-Host "MSI: $msiName ($('{0:N1} MB' -f ((Get-Item $msiName).Length / 1MB)))"
          } else {
            Write-Warning "MSI not found - ZIP only release"
          }

          echo "zipname=$zipName" >> $env:GITHUB_OUTPUT
          echo "msiname=$msiName" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "date=$date" >> $env:GITHUB_OUTPUT
          echo "sha=$sha" >> $env:GITHUB_OUTPUT

      # --------------------------------------------------------
      # CODE SIGNING — SignPath Foundation, nightly channel
      #
      # Same gate and the same two artifact configurations ("zip", "msi") as the
      # release workflow, but under the "test-signing" policy: SignPath issues those
      # automatically, without the human approval release signing needs, with a test
      # certificate that Windows does NOT trust. A nightly signed this way earns no
      # SmartScreen or Defender reputation; what it proves is that the pipeline and
      # the portal configuration work, so the first tagged release is not the first
      # time signing runs. The trusted certificate stays reserved for tagged builds.
      # Mandatory once the secrets exist: a nightly that cannot be signed is not
      # published.
      # --------------------------------------------------------
      - name: Upload unsigned nightly ZIP
        if: env.SIGNPATH_CONFIGURED == 'true'
        id: upload-nightly-zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-unsigned-zip
          path: ${{ steps.meta.outputs.zipname }}
          retention-days: 1
          if-no-files-found: error

      - name: Sign nightly ZIP
        if: env.SIGNPATH_CONFIGURED == 'true'
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'mRemoteNG'
          signing-policy-slug: 'test-signing'
          artifact-configuration-slug: 'zip'
          github-artifact-id: '${{ steps.upload-nightly-zip.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: '${{ github.workspace }}/signed'
          wait-for-completion-timeout-in-seconds: 900

      - name: Upload unsigned nightly MSI
        if: env.SIGNPATH_CONFIGURED == 'true' && steps.meta.outputs.msiname != ''
        id: upload-nightly-msi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-unsigned-msi
          path: ${{ steps.meta.outputs.msiname }}
          retention-days: 1
          if-no-files-found: error

      - name: Sign nightly MSI
        if: env.SIGNPATH_CONFIGURED == 'true' && steps.meta.outputs.msiname != ''
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: 'mRemoteNG'
          signing-policy-slug: 'test-signing'
          artifact-configuration-slug: 'msi'
          github-artifact-id: '${{ steps.upload-nightly-msi.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: '${{ github.workspace }}/signed'
          wait-for-completion-timeout-in-seconds: 900

      # The names travel through env, never spliced into the script text: they are built from
      # the csproj <Version>, and a quote in that value must stay data, not become PowerShell.
      - name: Replace nightly assets with their signed copies
        if: env.SIGNPATH_CONFIGURED == 'true'
        shell: pwsh
        env:
          ZIP_NAME: ${{ steps.meta.outputs.zipname }}
          MSI_NAME: ${{ steps.meta.outputs.msiname }}
        run: |
          foreach ($name in @($env:ZIP_NAME, $env:MSI_NAME)) {
            if (-not $name) { continue }
            $signed = Get-ChildItem -Path signed -Recurse -File -Filter $name -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $signed) { throw "No signed copy of $name came back from SignPath" }
            Copy-Item -Path $signed.FullName -Destination $name -Force
            Write-Host "Signed: $name"
          }

      - name: Upload nightly release assets
        id: upload-release-assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-release-assets
          path: |
            ${{ steps.meta.outputs.zipname }}
            ${{ steps.meta.outputs.msiname }}
          retention-days: 1
          if-no-files-found: error

  # ============================================================
  # Job 2: Publish. The only job with a write token.
  # ============================================================
  publish:
    name: Publish nightly
    needs: nightly
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download nightly release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-release-assets
          path: release-assets

      # This job has no checkout, so gh cannot infer the repository from a working tree;
      # GH_REPO names it. Without it the delete fails, the error is swallowed below, and the
      # old release survives with its tag still on the previous commit.
      - name: Delete previous nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete nightly --yes --cleanup-tag 2>/dev/null || true

      - name: Create nightly release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          # Pin the recreated tag to the commit that was built, not to whatever main points at
          # by the time this job runs.
          target_commitish: ${{ github.sha }}
          name: "Nightly Build — ${{ needs.nightly.outputs.date }} (v${{ needs.nightly.outputs.version }})"
          files: release-assets/*
          body: |
            ## Nightly Build

            **Version:** v${{ needs.nightly.outputs.version }}
            **Date:** ${{ needs.nightly.outputs.date }}
            **Commit:** [${{ needs.nightly.outputs.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
            **Architecture:** x64 (framework-dependent)
            **Tests:** All passed

            ### Downloads

            | Format | Description |
            |--------|-------------|
            | **ZIP** | Portable — extract and run |
            | **MSI** | Windows Installer — installs to Program Files with shortcuts |

            > [!WARNING]
            > This is an automated build from the `main` branch. It includes the latest changes but may not be fully tested in production scenarios. For the stable release, use the [latest release](https://github.com/${{ github.repository }}/releases/latest).

            > [!NOTE]
            > Fixes in this build were developed and verified by our automated pipeline — the full automated test suite passes, but no test harness can reproduce *your* environment. If a nightly contains a fix for an issue you reported, **your test is the real verification**, and reporting back (either way) is the most valuable contribution you can make. How this fork is maintained: [#167](https://github.com/${{ github.repository }}/issues/167).

            The framework-dependent build requires [.NET Desktop Runtime 10.0](https://dotnet.microsoft.com/download/dotnet/10.0).

            > [!IMPORTANT]
            > **Extract the ZIP into a fresh/empty folder.** Overwriting a folder that previously held a *self-contained* build leaves stale .NET runtime files (`hostfxr.dll`, `coreclr.dll`, …) behind, and the app will fail to start with a native "You must install .NET" dialog even when the runtime is installed (#130).

            This release is automatically replaced on every push to `main`.
          draft: false
          prerelease: true
